[package]
name = "itax-reply-agent"
version = "2.0.0"
description = "Indian Income Tax Legal Reply Agent"
authors = ["Pratik V Kothari"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "itax_reply_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP, used only for the /health poll against 127.0.0.1.
ureq = "2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
# CREATE_NO_WINDOW when spawning backend.exe — without it the PyInstaller
# bootloader flashes a console window on every launch.
winapi = { version = "0.3", features = ["winbase"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# A desktop app ships once and runs for months: trade build time for size.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
